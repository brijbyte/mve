name: Publish package

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: read
  id-token: write

jobs:
  publish:
    runs-on: ubuntu-latest
    environment: npm-publish

    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up pinned tools
        uses: jdx/mise-action@c2a87611a18de5b3828c5652fe268e992400cb5c # v4.3.0

      - name: Install dependencies
        run: mise exec -- pnpm install --frozen-lockfile

      - name: Build package
        run: mise exec -- pnpm --filter @brijbyte/mve build

      - name: Verify tag matches package version
        working-directory: packages/minimum-viable-editor
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          PACKAGE_VERSION=$(mise exec -- node -p "JSON.parse(require('fs').readFileSync('package.json', 'utf8')).version")
          test "v${PACKAGE_VERSION}" = "${RELEASE_TAG}"

      - name: Publish to npm via trusted publishing
        working-directory: packages/minimum-viable-editor
        run: mise exec -- npm publish --access public
